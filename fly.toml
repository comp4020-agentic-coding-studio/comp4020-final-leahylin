# Deploy config for the course-managed Fly.io setup. Fly builds the Dockerfile
# and runs whatever it produces, so the stack is yours. What's fixed is the
# shape the course watches — leave these settings as they are:
#
#   - one shared-cpu-1x machine with 256 MB of memory, so the app has to fit
#   - one volume, mounted at /data: the only storage that survives a restart
#     or a redeploy. There's no separate database server; another Fly app
#     beside this one (a managed Postgres, say) is outside the course setup
#   - the app serves HTTP on 0.0.0.0:$PORT; Fly's proxy terminates TLS in
#     front of it, so the app itself sees plain http
#
# There's no `app` line: the app is named after this repo, and the deploy
# command passes it. While the repo is private you deploy by hand from here,
# with the token the course sent you sitting in mise.local.toml:
#
#   flyctl deploy --remote-only --ha=false -a <this-repo-name>
#
# (remote build on Fly's builders; one machine, one volume). Once you ship the
# repo public, CI runs the same command on every push to main.

primary_region = "syd"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
# Normally the machine stops when nobody's using it and starts on the next
# request, which is most of why the app costs cents, not dollars.
#
# Held awake for the crit 9 session (Mon 12 Oct): the pod opens the app on
# their own devices at once, and the first one through would otherwise wait
# on a cold boot while the room watches. A day of shared-cpu-1x is cents, and
# a cold start in front of the pod isn't worth saving them.
#
# Put this back to 0 after the session.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

# Live updates hold a request open for minutes, which the proxy's defaults
# don't suit: unset, it counts *connections* against a soft limit of 20, and
# src/events.ts allows 60 streams on its own. Past the soft limit the proxy
# treats the machine as full, and with one machine there is nowhere to send
# the overflow — it's plain page loads that suffer, not just streams.
#
# Counting requests instead means an idle keep-alive socket costs nothing and
# an open stream costs exactly one. Both limits sit above the app's own cap of
# 60, so that cap is what bites first — which is the point: it turns a
# connection away in a way the browser recovers from, where the proxy wouldn't.
[http_service.concurrency]
type = "requests"
soft_limit = 80
hard_limit = 120

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"

[mounts]
source = "data"
destination = "/data"
initial_size = "1gb"
